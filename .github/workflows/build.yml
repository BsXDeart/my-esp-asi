name: Build ASI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: |
        cl.exe /LD /EHsc main.cpp /link psapi.lib /out:ESPName.asi

    - name: Upload ASI
      uses: actions/upload-artifact@v3
      with:
        name: ESPName-ASI
        path: ESPName.asi
