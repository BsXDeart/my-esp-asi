name: Build ASI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -A Win32

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload ASI
      uses: actions/upload-artifact@v4
      with:
        name: ESPName-ASI
        path: build/Release/*.asi
